name: SBOM fixture validation

on:
  push:
    branches:
      - foundation/architecture-baseline-2026-11-19
    paths:
      - "tests/fixtures/supply-chain/sbom/**"
      - "tools/validate_sbom_fixtures.py"
      - ".github/workflows/sbom-fixture-validation.yml"
  pull_request:
    branches:
      - main
    paths:
      - "tests/fixtures/supply-chain/sbom/**"
      - "tools/validate_sbom_fixtures.py"
      - ".github/workflows/sbom-fixture-validation.yml"

permissions:
  contents: read

concurrency:
  group: sbom-fixture-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-cyclonedx-1-7-fixtures:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install pinned Draft 7 validator
        run: python -m pip install --disable-pip-version-check "jsonschema==4.23.0"
      - name: Validate positive, negative, and dependency-graph fixtures
        run: python tools/validate_sbom_fixtures.py
